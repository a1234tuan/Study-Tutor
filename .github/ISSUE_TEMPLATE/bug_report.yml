name: Bug report
description: Report a reproducible StudyJournal problem without private data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach API keys, backups, private notes, recordings, or unredacted logs.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: Android 0.2.3 / Windows 0.1.6 / commit hash
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android, Windows, Web/PWA]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use synthetic or redacted content only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private notes, backups, and personal data.
          required: true
